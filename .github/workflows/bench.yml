name: Performance Benchmarks

on:
  push:
    branches: [main, tauri-rewrite]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/bench.yml'
  pull_request:
    branches: [main, tauri-rewrite]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/bench.yml'
  workflow_dispatch:

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
            ${{ runner.os }}-cargo-

      - name: Run benchmarks
        working-directory: src-tauri
        run: |
          # Run benchmarks with --noplot for CI (no gnuplot dependency)
          cargo bench --bench indexation_benchmarks -- --noplot 2>&1 | tee benchmark-output.txt

      - name: Extract performance metrics
        working-directory: src-tauri
        run: |
          echo "## Performance Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SQLite Import Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep -A 5 "sqlite_import" benchmark-output.txt | head -30 >> $GITHUB_STEP_SUMMARY || echo "No import benchmarks found" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SQLite Query Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep -A 5 "sqlite_query" benchmark-output.txt | head -30 >> $GITHUB_STEP_SUMMARY || echo "No query benchmarks found" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Check performance gates
        working-directory: src-tauri
        run: |
          # Performance gate checks
          # These thresholds are based on Story 6.6 acceptance criteria:
          # - Import speed: ≥200K entries/sec
          # - Query latency: <750ms (P95)
          # - Memory peak: <1GB

          echo "Checking performance gates..."

          # Check if benchmarks completed successfully
          if grep -q "Benchmarking" benchmark-output.txt; then
            echo "✅ Benchmarks completed successfully"
          else
            echo "❌ Benchmark output may be incomplete"
            exit 1
          fi

          # Check for performance regressions detected by criterion
          if grep -q "Performance has regressed" benchmark-output.txt; then
            echo "⚠️ Performance regression detected!"
            grep -A 3 "Performance has regressed" benchmark-output.txt
            echo ""
            echo "Review the regression before merging."
            # Note: Not failing CI, but warning. Set exit 1 to enforce strict gates.
          else
            echo "✅ No performance regressions detected"
          fi

          # Check for benchmark failures (panics, errors)
          if grep -q "FAILED\|panicked\|error\[" benchmark-output.txt; then
            echo "❌ Benchmark failures detected!"
            grep -B 2 -A 5 "FAILED\|panicked\|error\[" benchmark-output.txt
            exit 1
          fi

          echo "✅ Performance gate checks passed"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            src-tauri/target/criterion/
            src-tauri/benchmark-output.txt
          retention-days: 14
          if-no-files-found: warn

  benchmark-comparison:
    name: Compare with Baseline
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.event_name == 'pull_request'

    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results

      - name: Compare with baseline
        run: |
          echo "## Benchmark Comparison" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Comparing performance against main branch baseline..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Note: For full comparison, we would:
          # 1. Download baseline from main branch artifact
          # 2. Use criterion's compare feature
          # 3. Report regressions/improvements

          echo "See criterion HTML reports in artifacts for detailed comparison." >> $GITHUB_STEP_SUMMARY
