[package]
name = "opnsense-log-viewer"
version = "0.1.0"
description = "High-performance desktop application for investigating OPNsense firewall logs"
authors = ["Shay"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "opnsense_log_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1.0", features = [] }

[dependencies]
tauri = { version = "2.1.2", features = [] }
tauri-plugin-opener = "2.5.3"
tauri-plugin-dialog = "2.0.1"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
tokio = { version = "1.42.0", features = ["rt-multi-thread", "fs", "io-util", "time"] }
chrono = { version = "0.4.39", features = ["serde"] }
regex = "1.10.7"
csv = "1.3.3"
lazy_static = "1.5.0"
log = "0.4.22"
thiserror = "2.0.9"
roaring = { version = "0.10", features = ["serde"] }
sha2 = "0.10"
bincode = { version = "2.0.1", features = ["serde"] }
zstd = "0.13.3"
hex = "0.4"

# Story 3.1: API Connection & Credential Storage
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
reqwest-middleware = "0.3"
reqwest-retry = "0.6"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
ring = "0.17"
argon2 = "0.5"
machine-uid = "0.5"
anyhow = "1"
dirs = "5.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
tempfile = "3.14.0"
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
peak_alloc = "0.2"

[[bench]]
name = "indexation_benchmarks"
harness = false

